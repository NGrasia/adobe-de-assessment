AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Search Keyword Performance Analyzer — Lambda + S3 + EventBridge

Parameters:
  StackPrefix:
    Type: String
    Default: adobe-de
  Environment:
    Type: String
    Default: develop
  Region:
    Type: String
    Default: us-east-1

Resources:

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackPrefix}-${Environment}-input-${Region}"
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackPrefix}-${Environment}-output-${Region}"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-${Environment}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackPrefix}-${Environment}-*:*"
        - PolicyName: S3ReadInput
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${StackPrefix}-${Environment}-input-${Region}/*"
        - PolicyName: S3WriteOutput
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${StackPrefix}-${Environment}-output-${Region}/*"

  SearchKeywordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${StackPrefix}-${Environment}-search-keyword"
      CodeUri: src/
      Handler: lambda_handler.handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          OUTPUT_BUCKET: !Ref OutputBucket

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SearchKeywordFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3EventRule.Arn

  S3EventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${StackPrefix}-${Environment}-s3-object-created"
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref InputBucket
          object:
            key:
              - suffix: .sql
      Targets:
        - Id: SearchKeywordLambda
          Arn: !GetAtt SearchKeywordFunction.Arn

Outputs:
  InputBucketName:
    Value: !Ref InputBucket
  OutputBucketName:
    Value: !Ref OutputBucket
  LambdaFunctionName:
    Value: !Ref SearchKeywordFunction
  EventRuleArn:
    Value: !GetAtt S3EventRule.Arn